<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دروسك بلس | الطالب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070c18;--panel:#101a2d;--line:#24334a;--muted:#9aabc4;--white:#f4f7ff;--mint:#53dfb5;--blue:#4386ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#102b35 0,transparent 36%),var(--bg);color:var(--white);font-family:Cairo,sans-serif;min-height:100vh}
.wrap{width:min(1120px,92%);margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:900;font-size:20px}.brand span{color:var(--mint)}.profile{border:1px solid var(--line);background:#101a2d;color:white;border-radius:14px;padding:10px 14px;cursor:pointer}
.hero{border:1px solid #21434a;background:linear-gradient(115deg,#122b35,#0d1729 70%);border-radius:25px;padding:28px;margin-bottom:22px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;left:28px;top:5px;font-size:75px;color:#1c4850;opacity:.5}.eyebrow{color:var(--mint);font-size:13px;font-weight:800}.hero h1{font-size:clamp(24px,4vw,38px);margin:8px 0}.hero h1 span{color:var(--mint)}.hero p{color:var(--muted);margin:0}.stats{display:flex;gap:10px;margin:18px 0 26px}.stat{flex:1;text-align:center;padding:15px;background:#0d1525;border:1px solid var(--line);border-radius:16px}.stat b{display:block;color:#8eb6ff;font-size:25px}.stat small{color:var(--muted)}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 14px}.heading h2{font-size:22px;margin:0}.back{background:#17243a;color:#dce8ff;border:1px solid var(--line);border-radius:12px;padding:9px 16px;font:700 14px Cairo;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{background:linear-gradient(145deg,#121e32,#0e1728);border:1px solid var(--line);border-radius:19px;padding:15px;min-width:0}.thumb{width:100%;height:125px;object-fit:cover;border-radius:13px;background:#0a1120;margin-bottom:10px}.item h3{margin:0 0 3px;font-size:17px}.sub{font-size:12px;color:var(--muted)}.action{width:100%;margin-top:13px;border:0;border-radius:12px;padding:11px 12px;background:linear-gradient(100deg,#3979ed,#2860d5);color:white;font:800 14px Cairo;cursor:pointer}.action:hover{filter:brightness(1.12)}.lecture,.video{display:flex;gap:13px;align-items:center;margin-bottom:12px}.lecture .thumb,.video .thumb{width:90px;height:72px;flex-shrink:0;margin:0}.lecture .action,.video .action{margin-top:8px}.video{align-items:flex-start}.video .info{flex:1;min-width:0}.video a{color:#9fc2ff;text-decoration:none}.empty,.notice{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.error{color:#ffaaaa}.hidden{display:none!important}

/* صور المواد والمدرسين: حجم كبير ومربع مع إظهار الصورة كاملة */
.item:not(.lecture):not(.video) .thumb{
  display:block;width:100%;aspect-ratio:1/1;height:auto;
  object-fit:contain;background:#fff;border-radius:13px;margin:0 0 12px;
}
@media(max-width:560px){.wrap{width:94%;padding-top:17px}.hero{padding:21px}.stats{gap:7px}.stat{padding:10px 5px}.grid{gap:10px}.item{padding:11px}.thumb{height:95px}.item:not(.lecture):not(.video) .thumb{height:auto;aspect-ratio:1/1}.item h3{font-size:15px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">✦ دروسك <span>بلس</span></div><a class="profile" href="profile.html" style="text-decoration:none">👤 الملف الشخصي</a></header>
<section class="hero" id="hero"><div class="eyebrow">✦ منصتك التعليمية في مكان واحد</div><h1 id="welcome">نورت دروسك بلس ✨</h1><p>اختار المادة، وبعدها المدرس والشهر والمحاضرة وابدأ مذاكرتك.</p></section>
<div class="heading"><h2 id="sectionTitle">المواد المتاحة ليك</h2><button id="backBtn" class="back hidden" onclick="goBack()">رجوع</button></div>
<div id="content" class="grid"><div class="notice">جاري تجهيز موادك...</div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDNttAJ8HkqQcsQXwrRswIZdhHFdZr1hrA",authDomain:"shap-f0fde.firebaseapp.com",databaseURL:"https://shap-f0fde-default-rtdb.firebaseio.com",projectId:"shap-f0fde",storageBucket:"shap-f0fde.firebasestorage.app",messagingSenderId:"628511539150",appId:"1:628511539150:web:9c08a78ef233729021b59f",measurementId:"G-8BXGLBWZE9"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const $=id=>document.getElementById(id);let branchId="",studentName="",tree={},stack=[],currentLevel="subjects",liveStarted=false;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function arr(v){return v?Object.entries(v).map(([id,x])=>({id,...x})):[]}
function img(src){return src?`<img class="thumb" src="${esc(src)}" alt="">`:""}
function setStats(a,b,c){$("statA").textContent=a;$("statB").textContent=b;$("statC").textContent=c}

function profileStatsKey(){const c=sessionStorage.getItem("drosak_student_code")||localStorage.getItem("drosak_student_code")||"";return "drosak_view_stats_"+c}
function trackViewed(type,item){try{const key=profileStatsKey();let data=JSON.parse(localStorage.getItem(key)||'{"subjects":[],"teachers":[],"months":[],"lectures":[],"videos":[]}');if(!Array.isArray(data[type]))data[type]=[];const id=String(item.id||item.name||"");const name=String(item.name||"عنصر");if(!data[type].some(x=>x.id===id))data[type].push({id,name,at:Date.now()});localStorage.setItem(key,JSON.stringify(data));}catch(e){}}
function counts(subjects){let teachers=0,lectures=0;subjects.forEach(s=>arr(s.teachers).forEach(t=>{teachers++;arr(t.months).forEach(m=>arr(m.lectures).forEach(l=>lectures++))}));return[teachers,lectures]}
// كود الجلسة يُرسل من صفحة تسجيل الدخول عبر sessionStorage بنفس النطاق.
// المفتاح المتفق عليه مع صفحة الدخول: drosak_student_code
async function start(){
 // صفحة المواد لا تقرأ الأكواد من قاعدة المحتوى؛ تستقبل بيانات الجلسة التي تحققت منها صفحة الدخول في قاعدة الأكواد.
 let session=null;
 try{session=JSON.parse(sessionStorage.getItem("drosak_firebase_student")||localStorage.getItem("drosak_firebase_student")||"null")}catch(_){}
 const code=(session&&session.code)||(sessionStorage.getItem("drosak_student_code")||localStorage.getItem("drosak_student_code")||"").trim();
 if(!code||!session||!session.branchId){
  $("content").innerHTML='<div class="notice error">بيانات الدخول غير مكتملة. ارجع لصفحة تسجيل الدخول واكتب كودك مرة واحدة.</div>';
  return;
 }
 if(session.expiresAt && Date.now()>Number(session.expiresAt)){
  $("content").innerHTML='<div class="notice error">انتهت صلاحية الكود. ارجع لصفحة تسجيل الدخول وتواصل مع الإدارة.</div>';
  return;
 }
 // توحيد مفاتيح الشعب القديمة والجديدة لتطابق المفاتيح التي تستخدمها لوحة الأدمن.
 const rawBranch=String(session.branchId||session.branch||session.branchName||"").trim();
 const branchAliases={
  "scientific_sciences":"science_bio", "science_bio":"science_bio", "علمي علوم":"science_bio", "علمى علوم":"science_bio",
  "scientific_math":"science_math", "science_math":"science_math", "علمي رياضة":"science_math", "علمى رياضة":"science_math",
  "literary":"literary", "أدبي":"literary", "ادبي":"literary",
  "azhar":"azhar", "أزهر":"azhar", "ازهر":"azhar",
  "baccalaureate":"baccalaureate", "بكالوريا":"baccalaureate"
 };
 branchId=branchAliases[rawBranch]||rawBranch;
 if(!branchId){$("content").innerHTML='<div class="notice error">الشعبة غير محددة في بيانات الكود. تواصل مع الإدارة لتصحيح بيانات الشعبة.</div>';return;}
 studentName=session.studentName||session.name||sessionStorage.getItem("drosak_student_name")||localStorage.getItem("drosak_student_name")||"طالبنا العزيز";
 $("welcome").innerHTML=`نورت دروسك بلس، <span>${esc(studentName)}</span> ✨`;
 $("content").innerHTML='<div class="notice">جاري تحميل مواد شعبتك...</div>';
 try{await showSubjects()}
 catch(e){$("content").innerHTML=`<div class="notice error">تعذر تحميل المواد من قاعدة المحتوى: ${esc(e.message||"تحقق من اتصال Firebase وصلاحيات القراءة")}</div><button class="action" onclick="start()">إعادة المحاولة</button>`}
}
function startLiveContent(){
  if(liveStarted||!branchId)return;
  liveStarted=true;
  db.ref("content/"+branchId+"/subjects").on("value",snap=>{
    tree=snap.val()||{};
    refreshVisibleContent();
  },err=>console.warn("Live content listener:",err));
}
function findItem(collection,id){return arr(collection).find(x=>String(x.id)===String(id))||null}
function refreshVisibleContent(){
  if(!liveStarted)return;
  const subjectsNow=arr(tree);
  if(currentLevel==="subjects"){
    renderCards(subjectsNow,"teachers","مدرس","اذهب للمدرسين",openTeachers);return;
  }
  const s=findItem(tree,window.currentSubject?.id);
  if(!s){showSubjects();return;}
  if(currentLevel==="teachers"){
    $("sectionTitle").textContent="مدرسو "+s.name;
    renderCards(arr(s.teachers),"months","شهر","اذهب للشهور",t=>openMonths(s,t));return;
  }
  const t=findItem(s.teachers,window.currentTeacher?.[1]?.id);
  if(!t){openTeachers(s,true);return;}
  if(currentLevel==="months"){
    $("sectionTitle").textContent="شهور "+t.name;
    renderCards(arr(t.months),"lectures","محاضرة","اذهب للمحاضرات",m=>openLectures(s,t,m));return;
  }
  const m=findItem(t.months,window.currentLecture?.[2]?.id);
  if(!m){openMonths(s,t,true);return;}
  if(currentLevel==="lectures"){
    $("sectionTitle").textContent="محاضرات "+m.name;
    const items=arr(m.lectures);$("content").className="";
    if(!items.length){$("content").innerHTML='<div class="empty">لا توجد محاضرات.</div>';return;}
    $("content").innerHTML=items.map((l,i)=>`<article class="item lecture">${img(l.image)}<div style="flex:1"><h3>${esc(l.name)}</h3><div class="sub">${arr(l.videos).length} فيديو</div><button class="action" data-i="${i}">اذهب للفيديوهات</button></div></article>`).join("");
    [...$("content").querySelectorAll("button")].forEach(b=>b.onclick=()=>{trackViewed("lectures",items[+b.dataset.i]);openVideos(items[+b.dataset.i])});
  }
}
async function showSubjects(){
 $("hero").classList.remove("hidden");
 const s=await db.ref("content/"+branchId+"/subjects").get();tree= s.val()||{};const subjects=arr(tree);startLiveContent();
 $("sectionTitle").textContent="المواد المتاحة ليك";$("backBtn").classList.add("hidden");
 renderCards(subjects,"teachers","مدرس","اذهب للمدرسين",openTeachers);
}
function renderCards(items,countKey,countLabel,button,handler){
 $("content").className="grid";
 if(!items.length){$("content").innerHTML='<div class="empty">مفيش محتوى مضاف للقسم ده لسه.</div>';return}
 $("content").innerHTML=items.map((x,i)=>`<article class="item">${img(x.image)}<h3>${esc(x.name)}</h3><div class="sub">${arr(x[countKey]).length} ${countLabel}</div><button class="action" data-i="${i}">${button}</button></article>`).join("");
 [...$("content").querySelectorAll("button")].forEach(b=>b.onclick=()=>handler(items[+b.dataset.i]));
}
function nav(title,items,back,kind){
  $("hero").classList.add("hidden");$("sectionTitle").textContent=title;$("backBtn").classList.remove("hidden");$("backBtn").textContent=back;$("content").className="grid";stack.push(kind);
  try{history.pushState({drosakContentLevel:kind},"","#"+kind+"-"+Date.now())}catch(e){}
}
function openTeachers(subject,restoring=false){trackViewed("subjects",subject);currentLevel="teachers";if(!restoring)nav("مدرسو "+subject.name,arr(subject.teachers),"رجوع للمواد","subjects");else{$("sectionTitle").textContent="مدرسو "+subject.name;$("backBtn").classList.remove("hidden");$("backBtn").textContent="رجوع للمواد";}renderCards(arr(subject.teachers),"months","شهر","اذهب للشهور",t=>openMonths(subject,t))}
function openMonths(subject,teacher,restoring=false){trackViewed("teachers",teacher);currentLevel="months";if(!restoring)nav("شهور "+teacher.name,arr(teacher.months),"رجوع للمدرسين","teachers");else{$("sectionTitle").textContent="شهور "+teacher.name;$("backBtn").classList.remove("hidden");$("backBtn").textContent="رجوع للمدرسين";}renderCards(arr(teacher.months),"lectures","محاضرة","اذهب للمحاضرات",m=>openLectures(subject,teacher,m))}
function openLectures(subject,teacher,month,restoring=false){trackViewed("months",month);currentLevel="lectures";if(!restoring)nav("محاضرات "+month.name,arr(month.lectures),"رجوع للشهور","months");else{$("sectionTitle").textContent="محاضرات "+month.name;$("backBtn").classList.remove("hidden");$("backBtn").textContent="رجوع للشهور";}const items=arr(month.lectures);$("content").className="";if(!items.length){$("content").innerHTML='<div class="empty">لا توجد محاضرات.</div>';return}
 $("content").innerHTML=items.map((l,i)=>`<article class="item lecture">${img(l.image)}<div style="flex:1"><h3>${esc(l.name)}</h3><div class="sub">${arr(l.videos).length} فيديو</div><button class="action" data-i="${i}">اذهب للفيديوهات</button></div></article>`).join("");
 [...$("content").querySelectorAll("button")].forEach(b=>b.onclick=()=>{trackViewed("lectures",items[+b.dataset.i]);openVideos(items[+b.dataset.i])});
}
function openVideos(lecture){
 const videos=arr(lecture.videos);
 trackViewed("lectures",lecture);
 if(!videos.length){nav("فيديوهات "+lecture.name,[],"رجوع للمحاضرات","lectures");$("content").innerHTML='<div class="empty">لا توجد فيديوهات.</div>';return}
 try{
  sessionStorage.setItem("drosak_player_playlist",JSON.stringify({
   lectureName:lecture.name||"المحاضرة",
   videos:videos.map(v=>({id:v.id||"",name:v.name||"فيديو",url:v.url||"",image:v.image||"",duration:v.duration||""}))
  }));
  sessionStorage.setItem("drosak_player_index","0");
  trackViewed("videos",videos[0]);
  location.href="player.html";
 }catch(e){
  $("content").innerHTML='<div class="notice error">تعذر فتح المشغل. حاول مرة أخرى.</div>';
 }
}
function goBack(){
  if(stack.length===0){showSubjects();return;}
  if(history.state && history.state.drosakContentLevel){history.back();return;}
  restorePreviousLevel();
}
function restorePreviousLevel(){
  if(stack.length===0){showSubjects();return;}
  const kind=stack.pop();
  if(kind==="subjects")showSubjects();
  else if(kind==="teachers"){const subject=window.currentSubject;openTeachers(subject,true)}
  else if(kind==="months"){const pair=window.currentTeacher;openMonths(pair[0],pair[1],true)}
  else if(kind==="lectures"){const l=window.currentLecture;openLectures(...l,true)}
}
window.addEventListener("popstate",()=>{restorePreviousLevel()});
const oldTeachers=openTeachers;openTeachers=function(s,restoring=false){window.currentSubject=s;oldTeachers(s,restoring)};
const oldMonths=openMonths;openMonths=function(s,t,restoring=false){window.currentTeacher=[s,t];oldMonths(s,t,restoring)};
const oldLectures=openLectures;openLectures=function(s,t,m,restoring=false){window.currentLecture=[s,t,m];oldLectures(s,t,m,restoring)};
try{history.replaceState({drosakContentRoot:true},"",location.href)}catch(e){}
start();
</script></body></html>
