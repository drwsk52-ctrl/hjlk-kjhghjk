<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دروسك بلس | الطالب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070c18;--panel:#101a2d;--line:#24334a;--muted:#9aabc4;--white:#f4f7ff;--mint:#53dfb5;--blue:#4386ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#102b35 0,transparent 36%),var(--bg);color:var(--white);font-family:Cairo,sans-serif;min-height:100vh}
.wrap{width:min(1120px,92%);margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:900;font-size:20px}.brand span{color:var(--mint)}.profile{border:1px solid var(--line);background:#101a2d;color:white;border-radius:14px;padding:10px 14px;cursor:pointer}
.hero{border:1px solid #21434a;background:linear-gradient(115deg,#122b35,#0d1729 70%);border-radius:25px;padding:28px;margin-bottom:22px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;left:28px;top:5px;font-size:75px;color:#1c4850;opacity:.5}.eyebrow{color:var(--mint);font-size:13px;font-weight:800}.hero h1{font-size:clamp(24px,4vw,38px);margin:8px 0}.hero h1 span{color:var(--mint)}.hero p{color:var(--muted);margin:0}.stats{display:flex;gap:10px;margin:18px 0 26px}.stat{flex:1;text-align:center;padding:15px;background:#0d1525;border:1px solid var(--line);border-radius:16px}.stat b{display:block;color:#8eb6ff;font-size:25px}.stat small{color:var(--muted)}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 14px}.heading h2{font-size:22px;margin:0}.back{background:#17243a;color:#dce8ff;border:1px solid var(--line);border-radius:12px;padding:9px 16px;font:700 14px Cairo;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{background:linear-gradient(145deg,#121e32,#0e1728);border:1px solid var(--line);border-radius:19px;padding:15px;min-width:0}.thumb{width:100%;height:125px;object-fit:cover;border-radius:13px;background:#0a1120;margin-bottom:10px}.item h3{margin:0 0 3px;font-size:17px}.sub{font-size:12px;color:var(--muted)}.action{width:100%;margin-top:13px;border:0;border-radius:12px;padding:11px 12px;background:linear-gradient(100deg,#3979ed,#2860d5);color:white;font:800 14px Cairo;cursor:pointer}.action:hover{filter:brightness(1.12)}.lecture,.video{display:flex;gap:13px;align-items:center;margin-bottom:12px}.lecture .thumb,.video .thumb{width:90px;height:72px;flex-shrink:0;margin:0}.lecture .action,.video .action{margin-top:8px}.video{align-items:flex-start}.video .info{flex:1;min-width:0}.video a{color:#9fc2ff;text-decoration:none}.empty,.notice{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.error{color:#ffaaaa}.hidden{display:none!important}
@media(max-width:560px){.wrap{width:94%;padding-top:17px}.hero{padding:21px}.stats{gap:7px}.stat{padding:10px 5px}.grid{gap:10px}.item{padding:11px}.thumb{height:95px}.item h3{font-size:15px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">✦ دروسك <span>بلس</span></div><button class="profile" onclick="alert('صفحة الملف الشخصي هتتعمل بشكل مستقل لاحقًا')">👤 الملف الشخصي</button></header>
<section class="hero"><div class="eyebrow">✦ منصتك التعليمية في مكان واحد</div><h1 id="welcome">نورت دروسك بلس ✨</h1><p>اختار المادة، وبعدها المدرس والشهر والمحاضرة وابدأ مذاكرتك.</p></section>
<section class="stats"><div class="stat"><b id="statA">0</b><small>مادة متاحة</small></div><div class="stat"><b id="statB">0</b><small>مدرس</small></div><div class="stat"><b id="statC">0</b><small>محاضرة</small></div></section>
<div class="heading"><h2 id="sectionTitle">المواد المتاحة ليك</h2><button id="backBtn" class="back hidden" onclick="goBack()">رجوع</button></div>
<div id="content" class="grid"><div class="notice">جاري تجهيز موادك...</div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDNttAJ8HkqQcsQXwrRswIZdhHFdZr1hrA",authDomain:"shap-f0fde.firebaseapp.com",databaseURL:"https://shap-f0fde-default-rtdb.firebaseio.com",projectId:"shap-f0fde",storageBucket:"shap-f0fde.firebasestorage.app",messagingSenderId:"628511539150",appId:"1:628511539150:web:9c08a78ef233729021b59f",measurementId:"G-8BXGLBWZE9"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const $=id=>document.getElementById(id);let branchId="",studentName="",tree={},stack=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function arr(v){return v?Object.entries(v).map(([id,x])=>({id,...x})):[]}
function img(src){return src?`<img class="thumb" src="${esc(src)}" alt="">`:""}
function setStats(a,b,c){$("statA").textContent=a;$("statB").textContent=b;$("statC").textContent=c}
function counts(subjects){let teachers=0,lectures=0;subjects.forEach(s=>arr(s.teachers).forEach(t=>{teachers++;arr(t.months).forEach(m=>arr(m.lectures).forEach(l=>lectures++))}));return[teachers,lectures]}
// كود الجلسة يُرسل من صفحة تسجيل الدخول عبر sessionStorage بنفس النطاق.
// المفتاح المتفق عليه مع صفحة الدخول: drosak_student_code
async function start(){
 const code=(sessionStorage.getItem("drosak_student_code")||localStorage.getItem("drosak_student_code")||"").trim();
 if(!code){
  $("content").innerHTML='<div class="notice error">انتهت جلسة الدخول أو لم يتم تسجيل الدخول. ارجع لصفحة تسجيل الدخول واكتب كودك هناك.</div>';
  return;
 }
 $("content").innerHTML='<div class="notice">جاري التحقق من الكود...</div>';
 try{
  const snap=await db.ref("studentCodes/"+code).get();const record=snap.val();
  if(!record||record.active===false||!record.branchId)throw Error("الكود غير صحيح أو غير مفعل.");
  if(record.status && !["نشط","active","فعال"].includes(String(record.status).trim().toLowerCase()))throw Error("الكود غير نشط حاليًا. تواصل مع الإدارة.");
  if(record.expiresAt){let expiry=Number(record.expiresAt);if(expiry>0&&expiry<100000000000)expiry*=1000;if(!expiry||Date.now()>expiry)throw Error("انتهت صلاحية الكود.");}
  branchId=record.branchId;studentName=record.studentName||record.name||sessionStorage.getItem("drosak_student_name")||localStorage.getItem("drosak_student_name")||"طالبنا العزيز";$("welcome").innerHTML=`نورت دروسك بلس، <span>${esc(studentName)}</span> ✨`;
  await showSubjects();
 }catch(e){$("content").innerHTML=`<div class="notice error">${esc(e.message||"تعذر الاتصال بقاعدة البيانات")}</div><button class="action" onclick="start()">إعادة المحاولة</button>`}
}
async function showSubjects(){
 const s=await db.ref("content/"+branchId+"/subjects").get();tree= s.val()||{};const subjects=arr(tree);const [teachers,lectures]=counts(subjects);setStats(subjects.length,teachers,lectures);
 $("sectionTitle").textContent="المواد المتاحة ليك";$("backBtn").classList.add("hidden");
 renderCards(subjects,"teachers","مدرس","اذهب للمدرسين",openTeachers);
}
function renderCards(items,countKey,countLabel,button,handler){
 $("content").className="grid";
 if(!items.length){$("content").innerHTML='<div class="empty">مفيش محتوى مضاف للقسم ده لسه.</div>';return}
 $("content").innerHTML=items.map((x,i)=>`<article class="item">${img(x.image)}<h3>${esc(x.name)}</h3><div class="sub">${arr(x[countKey]).length} ${countLabel}</div><button class="action" data-i="${i}">${button}</button></article>`).join("");
 [...$("content").querySelectorAll("button")].forEach(b=>b.onclick=()=>handler(items[+b.dataset.i]));
}
function nav(title,items,back,kind){$("sectionTitle").textContent=title;$("backBtn").classList.remove("hidden");$("backBtn").textContent=back;$("content").className="grid";stack.push(kind)}
function openTeachers(subject){nav("مدرسو "+subject.name,arr(subject.teachers),"رجوع للمواد","subjects");renderCards(arr(subject.teachers),"months","شهر","اذهب للشهور",t=>openMonths(subject,t))}
function openMonths(subject,teacher){nav("شهور "+teacher.name,arr(teacher.months),"رجوع للمدرسين","teachers");renderCards(arr(teacher.months),"lectures","محاضرة","اذهب للمحاضرات",m=>openLectures(subject,teacher,m))}
function openLectures(subject,teacher,month){nav("محاضرات "+month.name,arr(month.lectures),"رجوع للشهور","months");const items=arr(month.lectures);$("content").className="";if(!items.length){$("content").innerHTML='<div class="empty">لا توجد محاضرات.</div>';return}
 $("content").innerHTML=items.map((l,i)=>`<article class="item lecture">${img(l.image)}<div style="flex:1"><h3>${esc(l.name)}</h3><div class="sub">${arr(l.videos).length} فيديو</div><button class="action" data-i="${i}">اذهب للفيديوهات</button></div></article>`).join("");
 [...$("content").querySelectorAll("button")].forEach(b=>b.onclick=()=>openVideos(items[+b.dataset.i]));
}
function openVideos(lecture){nav("فيديوهات "+lecture.name,arr(lecture.videos),"رجوع للمحاضرات","lectures");const videos=arr(lecture.videos);$("content").className="";if(!videos.length){$("content").innerHTML='<div class="empty">لا توجد فيديوهات.</div>';return}
 $("content").innerHTML=videos.map(v=>`<article class="item video">${img(v.image)}<div class="info"><h3>${esc(v.name)}</h3><div class="sub">المدة: ${esc(v.duration||"غير محددة")}</div><a href="${esc(v.url)}" target="_blank" rel="noopener"><button class="action">اضغط للمشاهدة</button></a></div></article>`).join("");
}
function goBack(){if(stack.length===0)return;const kind=stack.pop();if(kind==="subjects")showSubjects();else if(kind==="teachers"){const subject=window.currentSubject;openTeachers(subject)}else if(kind==="months"){const [s,t]=window.currentTeacher;openMonths(s,t)}else if(kind==="lectures"){const l=window.currentLecture;openLectures(...l)}}
const oldTeachers=openTeachers;openTeachers=function(s){window.currentSubject=s;oldTeachers(s)};
const oldMonths=openMonths;openMonths=function(s,t){window.currentTeacher=[s,t];oldMonths(s,t)};
const oldLectures=openLectures;openLectures=function(s,t,m){window.currentLecture=[s,t,m];oldLectures(s,t,m)};
start();
</script></body></html>
