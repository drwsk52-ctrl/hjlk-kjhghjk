<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070c18">
<title>دروسك بلس | مشغل المحاضرات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070c18;--panel:#101a2d;--line:#24334a;--muted:#9aabc4;--white:#f4f7ff;--mint:#53dfb5;--blue:#4386ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#102b35 0,transparent 36%),var(--bg);color:var(--white);font-family:Cairo,sans-serif;min-height:100vh}
.wrap{width:min(1180px,94%);margin:auto;padding:22px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:20px;font-weight:900}.brand span{color:var(--mint)}.back{border:1px solid var(--line);background:#101a2d;color:#eaf1ff;border-radius:12px;padding:9px 14px;text-decoration:none;font:700 14px Cairo}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.main,.side{background:linear-gradient(145deg,#121e32,#0d1728);border:1px solid var(--line);border-radius:21px;padding:16px;min-width:0}.heading{margin:0 0 4px;font-size:21px}.sub{color:var(--muted);font-size:13px;margin-bottom:13px}
.screen{position:relative;width:100%;aspect-ratio:16/9;background:#02050b;border:1px solid #253650;border-radius:15px;overflow:hidden;display:grid;place-items:center}.screen video,.screen iframe{width:100%;height:100%;border:0;display:block;background:#000}.screen video{object-fit:contain}.placeholder{color:var(--muted);text-align:center;padding:20px}
.controls{display:flex;gap:10px;align-items:center;margin-top:13px}.control{flex:1;border:1px solid var(--line);background:#0b1526;color:#eaf1ff;border-radius:12px;padding:10px 12px;font:800 13px Cairo;cursor:pointer}.control.primary{background:linear-gradient(100deg,#3979ed,#2860d5);border:0}.control:disabled{opacity:.35;cursor:not-allowed}
.now{display:flex;justify-content:space-between;gap:12px;margin-top:14px;align-items:center}.now strong{font-size:16px}.now span{color:var(--muted);font-size:12px}
.side h2{font-size:18px;margin:0 0 4px}.count{color:var(--muted);font-size:12px;margin-bottom:13px}.playlist{display:grid;gap:9px;max-height:540px;overflow:auto;padding-left:2px}.video-row{width:100%;display:flex;gap:10px;align-items:center;text-align:right;padding:9px;border:1px solid var(--line);border-radius:13px;background:#0a1425;color:var(--white);cursor:pointer;font:700 13px Cairo}.video-row.active{border-color:#4386ff;background:#14294a;box-shadow:inset -3px 0 var(--mint)}.thumb{width:76px;height:52px;flex:0 0 76px;border-radius:8px;object-fit:cover;background:#17243a}.vname{min-width:0;flex:1}.vname b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vname small{display:block;color:var(--muted);font-weight:600;margin-top:3px}.empty{border:1px dashed var(--line);border-radius:13px;padding:20px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:11px;line-height:1.8;margin-top:14px}.error{color:#ffaaaa}
@media(max-width:850px){.layout{grid-template-columns:1fr}.playlist{max-height:360px;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.wrap{width:96%;padding-top:13px}.main,.side{padding:11px;border-radius:16px}.screen{border-radius:11px}.controls{gap:7px}.control{padding:9px 5px;font-size:12px}.playlist{grid-template-columns:1fr}.now{align-items:flex-start;flex-direction:column;gap:2px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">✦ دروسك <span>بلس</span></div><a class="back" href="subjects.html">← الرجوع للمواد</a></header>
<div class="layout">
<section class="main">
<h1 class="heading" id="lectureTitle">مشغل المحاضرة</h1><div class="sub">شاهد المحاضرة من مشغل دروسك بلس</div>
<div class="screen" id="screen"><div class="placeholder">جاري تجهيز الفيديو...</div></div>
<div class="now"><strong id="videoTitle">—</strong><span id="position">0 / 0</span></div>
<div class="controls">
<button class="control" id="prev">السابق</button>
<button class="control primary" id="next">الفيديو التالي ←</button>
</div>

</section>
<aside class="side">
<h2>فيديوهات المحاضرة</h2><div class="count" id="count">قائمة الفيديوهات</div>
<div class="playlist" id="playlist"><div class="empty">جاري تحميل القائمة...</div></div>
</aside>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let data={},videos=[],index=0,hls=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function isYouTube(u){return /youtu\.be|youtube\.com/i.test(u)}
function youtubeEmbed(u){
 try{const x=new URL(u);let id="";
 if(x.hostname.includes("youtu.be"))id=x.pathname.slice(1);
 else if(x.pathname.includes("/embed/"))id=x.pathname.split("/embed/")[1].split("/")[0];
 else if(x.pathname==="/watch")id=x.searchParams.get("v");
 else if(x.pathname.includes("/shorts/"))id=x.pathname.split("/shorts/")[1].split("/")[0];
 return id?"https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?rel=0&modestbranding=1&playsinline=1":"";
 }catch(e){return""}
}
function bunnyEmbed(u){
 // Bunny Stream embed links: accept both /embed/ and legacy /play/ forms.
 // Keep the complete query string because signed Bunny URLs may contain tokens.
 try{
  const x=new URL(u);
  const host=x.hostname.toLowerCase();
  if(host==="iframe.mediadelivery.net" || host.endsWith(".mediadelivery.net")){
   if(/^\/(embed|play)\//i.test(x.pathname)){
    x.pathname=x.pathname.replace(/^\/play\//i,"/embed/");
    return x.toString();
   }
  }
  // Some Bunny setups provide a direct CDN playlist instead of an iframe.
  if((host.endsWith(".b-cdn.net") || host.endsWith(".bunnycdn.com")) && /\.(m3u8|mp4)(?:$)/i.test(x.pathname))return "";
 }catch(e){}
 return "";
}
function saveProgress(){
 try{localStorage.setItem("drosak_player_last_"+(sessionStorage.getItem("drosak_student_code")||"guest"),JSON.stringify({index,at:Date.now()}))}catch(e){}
}
function renderList(){
 $("count").textContent=videos.length+" فيديو";
 $("playlist").innerHTML=videos.map((v,i)=>`<button class="video-row ${i===index?"active":""}" data-index="${i}">
 ${v.image?`<img class="thumb" src="${esc(v.image)}" loading="lazy" alt="">`:'<span class="thumb" style="display:grid;place-items:center">▶</span>'}
 <span class="vname"><b>${esc(v.name||"فيديو "+(i+1))}</b><small>${esc(v.duration||"اضغط للمشاهدة")}</small></span></button>`).join("");
 [...$("playlist").querySelectorAll("[data-index]")].forEach(b=>b.addEventListener("click",()=>play(+b.dataset.index)));
}
function teardown(){if(hls){hls.destroy();hls=null}}
function play(i){
 if(i<0||i>=videos.length)return;
 index=i;const v=videos[index],url=String(v.url||"").trim();
 teardown();$("screen").innerHTML="";$("videoTitle").textContent=v.name||"فيديو "+(i+1);$("position").textContent=(i+1)+" / "+videos.length;
 $("prev").disabled=i===0;$("next").disabled=i===videos.length-1;renderList();saveProgress();
 if(!url){$("screen").innerHTML='<div class="placeholder error">رابط الفيديو غير موجود في بيانات هذا الفيديو.</div>';return}
 const yt=isYouTube(url)?youtubeEmbed(url):"",bunny=bunnyEmbed(url);
 if(yt||bunny){
  const frame=document.createElement("iframe");frame.src=yt||bunny;frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";frame.allowFullscreen=true;frame.referrerPolicy="strict-origin-when-cross-origin";$("screen").appendChild(frame);return;
 }
 const video=document.createElement("video");video.controls=true;video.playsInline=true;video.preload="metadata";video.setAttribute("controlsList","nodownload noplaybackrate");video.disablePictureInPicture=true;$("screen").appendChild(video);
 if(/\.m3u8(?:$|[?#])/i.test(url)){
  if(video.canPlayType("application/vnd.apple.mpegurl"))video.src=url;
  else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true,backBufferLength:30,maxBufferLength:30});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)$("screen").insertAdjacentHTML("beforeend",'<div class="placeholder error">تعذر تشغيل البث. راجع رابط الفيديو أو صلاحياته.</div>')})}
  else $("screen").innerHTML='<div class="placeholder error">المتصفح لا يدعم صيغة الفيديو دي.</div>';
 }else video.src=url;
 video.addEventListener("ended",()=>{if(index<videos.length-1)play(index+1)});
}
$("prev").addEventListener("click",()=>play(index-1));$("next").addEventListener("click",()=>play(index+1));
try{data=JSON.parse(sessionStorage.getItem("drosak_player_playlist")||"{}");videos=Array.isArray(data.videos)?data.videos:[];index=Math.max(0,Math.min(videos.length-1,Number(sessionStorage.getItem("drosak_player_index")||0)))}catch(e){}
if(!videos.length){$("screen").innerHTML='<div class="placeholder error">مفيش قائمة فيديوهات وصلت للمشغل. افتح المحاضرة من صفحة المواد.</div>';$("playlist").innerHTML='<div class="empty">لا توجد فيديوهات.</div>'}
else{$("lectureTitle").textContent=data.lectureName||"المحاضرة";renderList();play(index)}
</script>
</body></html>
